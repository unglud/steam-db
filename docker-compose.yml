services:
  steam-games:
    build: .
    ports:
      - "3000"
    env_file:
      - path: .env
        required: false
    environment:
      STEAM_GAMES_DOCKER: "1"
      STEAM_GAMES_OUTPUT_FILE: /data/steam-games.json
      STEAM_GAMES_CACHE_DIR: /data/.cache/steam
      STEAM_GAMES_INTERVAL_HOURS: "24"
      PORT: "3000"
    volumes:
      - steam-games-data:/data
    networks:
      - default
      - changedetectionio
    restart: unless-stopped

volumes:
  steam-games-data:

networks:
  changedetectionio:
    external: true
    name: changedetectionio_default
